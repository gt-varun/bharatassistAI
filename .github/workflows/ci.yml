name: BharatAssist AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/backend and apps/frontend both import @bharatassist/shared-types
      # by its built dist/ output (see its package.json "main"/"types"), not
      # by source. shared-types' own "typecheck" script is `tsc --noEmit`,
      # which checks types but emits nothing — so without this step, the
      # very first typecheck of backend/frontend below fails with "Cannot
      # find module '@bharatassist/shared-types'" on a clean checkout, since
      # dist/ has never been generated.
      - name: Build shared-types
        run: pnpm --filter @bharatassist/shared-types build

      - name: Run ESLint
        run: pnpm lint

      - name: Run Type Checks
        run: pnpm typecheck

      - name: Run Unit Tests
        run: pnpm test

      - name: Build All Workspace Apps & Packages
        run: pnpm build
