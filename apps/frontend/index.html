<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      viewport-fit=cover lets the page paint into the notch / Dynamic Island /
      home-indicator regions, which is what makes env(safe-area-inset-*)
      report real values instead of zero. The layout then pads itself back
      out of those regions (see index.css). User scaling is deliberately left
      enabled — pinch-zoom is an accessibility feature, not a defect.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0E6B4E" />
    <title>BharatAssist AI — Find the government schemes you qualify for</title>
    <meta
      name="description"
      content="Search central and state government schemes in plain language, check what you qualify for, and get the exact list of documents you need — in 11 Indian languages."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
